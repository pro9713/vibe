<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <filter id="serumShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="#faf5ff"/>
  <g filter="url(#serumShadow)" transform="translate(135, 50)">
    <!-- Dropper top rubber bulb -->
    <path d="M50,15 C50,0 80,0 80,15 L80,35 L50,35 Z" fill="#3b0764"/>
    <!-- Gold / Silver collar ring -->
    <rect x="42" y="35" width="46" height="18" rx="3" fill="#e9d5ff"/>
    <rect x="45" y="40" width="40" height="8" fill="#d8b4fe"/>
    <!-- Glass bottle neck -->
    <rect x="52" y="53" width="26" height="20" fill="url(#bottleGrad)" opacity="0.8"/>
    <!-- Bottle shoulder & main cylinder -->
    <path d="M30,95 Q30,73 52,73 L78,73 Q100,73 100,95 L100,240 Q100,255 85,255 L45,255 Q30,255 30,240 Z" fill="url(#bottleGrad)"/>
    <!-- Clean Minimalist Label -->
    <rect x="36" y="115" width="58" height="100" rx="6" fill="#ffffff"/>
    <rect x="44" y="130" width="42" height="6" rx="2" fill="#9333ea"/>
    <line x1="44" y1="148" x2="76" y2="148" stroke="#a855f7" stroke-width="3"/>
    <line x1="44" y1="160" x2="86" y2="160" stroke="#d1d5db" stroke-width="2"/>
    <line x1="44" y1="170" x2="80" y2="170" stroke="#d1d5db" stroke-width="2"/>
    <line x1="44" y1="180" x2="70" y2="180" stroke="#d1d5db" stroke-width="2"/>
    <circle cx="65" cy="200" r="4" fill="#a855f7"/>
  </g>
</svg>
