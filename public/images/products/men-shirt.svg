<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="shirtShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="#eff6ff"/>
  <g filter="url(#shirtShadow)" transform="translate(85, 70)">
    <!-- Shirt body and sleeves -->
    <path d="M70,30 L30,65 L55,100 L75,80 L75,230 L155,230 L155,80 L175,100 L200,65 L160,30 Z" fill="url(#shirtGrad)"/>
    <!-- Collar -->
    <polygon points="70,30 115,75 160,30 145,25 115,50 85,25" fill="#3b82f6"/>
    <!-- Button placket -->
    <rect x="110" y="50" width="10" height="180" fill="#2563eb"/>
    <circle cx="115" cy="85" r="3" fill="#ffffff"/>
    <circle cx="115" cy="120" r="3" fill="#ffffff"/>
    <circle cx="115" cy="155" r="3" fill="#ffffff"/>
    <circle cx="115" cy="190" r="3" fill="#ffffff"/>
    <!-- Chest pocket -->
    <path d="M82,95 L98,95 L98,118 L90,123 L82,118 Z" fill="none" stroke="#60a5fa" stroke-width="2"/>
  </g>
</svg>
