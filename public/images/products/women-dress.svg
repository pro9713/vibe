<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="dressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="#fff1f2"/>
  <g filter="url(#dropShadow)" transform="translate(100, 60)">
    <!-- Dress outline -->
    <path d="M70,20 Q100,35 130,20 L150,60 Q130,70 125,95 L175,260 Q100,275 25,260 L75,95 Q70,70 50,60 Z" fill="url(#dressGrad)"/>
    <!-- Waist belt / accent -->
    <path d="M74,105 Q100,112 126,105 L124,118 Q100,125 76,118 Z" fill="#881337"/>
    <!-- Neckline detail -->
    <path d="M70,20 Q100,55 130,20" fill="none" stroke="#ffe4e6" stroke-width="4"/>
    <!-- Hem curve pleats -->
    <path d="M40,250 Q65,265 90,250 Q115,265 140,250 Q155,260 165,252" fill="none" stroke="#fda4af" stroke-width="2" opacity="0.6"/>
  </g>
</svg>
