<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="perfumeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="pShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="#fffbeb"/>
  <g filter="url(#pShadow)" transform="translate(135, 60)">
    <!-- Cap -->
    <rect x="35" y="10" width="60" height="45" rx="6" fill="#18181b"/>
    <rect x="52" y="55" width="26" height="15" fill="#f59e0b"/>
    <!-- Glass bottle body -->
    <rect x="15" y="70" width="100" height="160" rx="18" fill="url(#perfumeGrad)"/>
    <rect x="25" y="80" width="80" height="140" rx="10" fill="#fef3c7" opacity="0.3"/>
    <!-- Label -->
    <rect x="30" y="115" width="70" height="70" rx="4" fill="#ffffff"/>
    <rect x="40" y="130" width="50" height="5" rx="2" fill="#78350f"/>
    <rect x="45" y="142" width="40" height="3" rx="1" fill="#92400e"/>
    <rect x="48" y="152" width="34" height="2" rx="1" fill="#a1a1aa"/>
  </g>
</svg>
