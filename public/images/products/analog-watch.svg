<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="watchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="watchShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="#f8fafc"/>
  <g filter="url(#watchShadow)" transform="translate(140, 30)">
    <!-- Leather strap top -->
    <rect x="35" y="10" width="50" height="90" rx="6" fill="#78350f"/>
    <line x1="40" y1="15" x2="40" y2="95" stroke="#92400e" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="80" y1="15" x2="80" y2="95" stroke="#92400e" stroke-width="2" stroke-dasharray="4,4"/>
    <!-- Leather strap bottom -->
    <rect x="35" y="240" width="50" height="90" rx="6" fill="#78350f"/>
    <line x1="40" y1="245" x2="40" y2="325" stroke="#92400e" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="80" y1="245" x2="80" y2="325" stroke="#92400e" stroke-width="2" stroke-dasharray="4,4"/>
    <!-- Watch Case Outer Silver Ring -->
    <circle cx="60" cy="170" r="75" fill="#cbd5e1" stroke="#94a3b8" stroke-width="4"/>
    <!-- Crown -->
    <rect x="135" y="162" width="8" height="16" rx="2" fill="#94a3b8"/>
    <!-- Dial -->
    <circle cx="60" cy="170" r="65" fill="url(#watchGrad)"/>
    <!-- Hour markers -->
    <circle cx="60" cy="115" r="3" fill="#e2e8f0"/>
    <circle cx="115" cy="170" r="3" fill="#e2e8f0"/>
    <circle cx="60" cy="225" r="3" fill="#e2e8f0"/>
    <circle cx="5" cy="170" r="3" fill="#e2e8f0"/>
    <!-- Watch hands -->
    <line x1="60" y1="170" x2="60" y2="130" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="170" x2="95" y2="170" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="170" x2="40" y2="195" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Center cap -->
    <circle cx="60" cy="170" r="5" fill="#f8fafc"/>
  </g>
</svg>
